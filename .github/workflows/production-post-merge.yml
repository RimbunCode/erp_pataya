name: Build And Cleanup After Production Merge

on:
  pull_request:
    branches:
      - production
    types:
      - closed

permissions:
  contents: write

jobs:
  build-and-cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v5
        with:
          ref: production
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Remove resources source files
        run: |
          find resources/js -mindepth 1 -delete
          find resources/css -mindepth 1 -delete

      - name: Commit production artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A resources/js resources/css
          git add -f public/build
          git add -f bootstrap/ssr

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: build assets and cleanup sources after production merge"
          git push origin production
