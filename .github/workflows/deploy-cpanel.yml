name: Deploy (Zero Downtime + Rollback)

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [dev-1]
    types: [closed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging') }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build Frontend Code
        env:
          VITE_PUSHER_APP_KEY: ${{ secrets.VITE_PUSHER_APP_KEY }}
          VITE_PUSHER_APP_CLUSTER: ${{ secrets.VITE_PUSHER_APP_CLUSTER }}
        run: |
          composer install --no-dev --optimize-autoloader
          npm ci
          npm run build

      - name: Cleanup
        run: |
          rm -rf node_modules
          rm -rf resources/js
          rm -rf resources/css

      - name: Create artifact
        run: |
          mkdir -p build
          tar \
            --exclude="./build" \
            --exclude="node_modules" \
            --exclude=".git" \
            --warning=no-file-changed \
            -czf build/release.tar.gz .

      - name: Upload artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "build/release.tar.gz"
          target: "${{ secrets.SSH_PATH }}/tmp"
          strip_components: 1

      - name: Upload deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: ".scripts/*.sh"
          target: "${{ secrets.SSH_PATH }}"

      - name: Create Permission Script & Deploy with rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.SSH_PATH }}

            chmod +x .scripts/*.sh
            cd ./.scripts
            if [ "${{ github.event_name }}" == "push" ]; then
              bash ./deploy.sh production
            elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              bash ./deploy.sh ${{ github.event.inputs.environment }}
            else
              bash ./deploy.sh staging
            fi

      - name: Notify deploy webhook
        if: github.event_name == 'push'
        env:
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          VERSION=$(cat .release-please-manifest.json | jq -r '."."')

          TICKETS=$(grep -oP '\[#\K[^\]]+' CHANGELOG.md 2>/dev/null | head -50 | jq -Rsc 'split("\n")[:-1]' || echo '[]')

          CHANGELOG=$(awk "/^## \[${VERSION}\]/{found=1} found{print} /^## \[/{if(found && !/^## \[${VERSION}\]/) exit}" CHANGELOG.md 2>/dev/null | jq -Rs . || echo '""')

          curl -sf -X POST "${APP_URL}/api/webhooks/deploy" \
            -H "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tickets\": ${TICKETS}, \"environment\": \"production\", \"version\": \"${VERSION}\", \"changelog\": ${CHANGELOG}}"
