name: Build And Deploy to cPanel

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SOURCE_BRANCH: main
  DEPLOY_BRANCH: production

jobs:
  build-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # 🔥 KEY CHANGE: RESET production FROM main (clean snapshot)
      - name: Prepare deploy worktree (reset from main)
        run: |
          rm -rf ../deploy-worktree || true
          git worktree add -B ${{ env.DEPLOY_BRANCH }} ../deploy-worktree HEAD

      # 🔥 Build langsung di worktree
      - name: Build in deploy worktree
        run: |
          cd ../deploy-worktree

          composer install --no-dev --optimize-autoloader
          npm ci
          npm run build

      # 🔥 Cleanup (pengganti rsync)
      - name: Cleanup unnecessary files
        run: |
          cd ../deploy-worktree

          rm -rf vendor
          rm -rf node_modules
          rm -rf resources/js
          rm -rf resources/css

          mkdir -p resources/js
          mkdir -p resources/css

      - name: Publish deploy branch
        id: publish
        run: |
          cd ../deploy-worktree

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git add -f public/build

          if [ -d bootstrap/ssr ]; then
            git add -f bootstrap/ssr
          fi

          if git diff --cached --quiet; then
            echo "No changes to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: publish production artifacts"
          git push origin HEAD:${{ env.DEPLOY_BRANCH }}
          echo "published=true" >> "$GITHUB_OUTPUT"

  deploy-cpanel:
    needs: build-and-publish
    if: needs.build-and-publish.outputs.published == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH for cPanel deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            cd ${{ secrets.SSH_PATH }}

            git fetch origin
            git reset --hard origin/${{ env.DEPLOY_BRANCH }}

            composer install --no-dev --optimize-autoloader
            composer dump-autoload -o

            php artisan optimize:clear
            php artisan migrate:fresh --seed
            php artisan optimize
