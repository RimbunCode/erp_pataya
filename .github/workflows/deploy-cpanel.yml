name: Sync Production To cPanel

on:
  push:
    branches:
      - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ptpsn.co.id
      REMOTE_PORT: "31988"
      REMOTE_USER: ptpsn
      REMOTE_REPO: /home/ptpsn/erp.test.ptpsn.co.id

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/id_ed25519 <<'EOF'
          ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519

          cat >> ~/.ssh/known_hosts <<'EOF'
          [ptpsn.co.id]:31988 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOVWFUcCy2OQ0fPcd22dQkS39Y46D5mMzCSv48BbHw+C
          [ptpsn.co.id]:31988 ssh-rsa 
          [ptpsn.co.id]:31988 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBHTZ70YwfbCCV846Y+/ff3kPH7ea5gHuVBcOoHCJuFy/f7Y68Ef3mWGb8Sr3P9Lphn+BRqJ4tJO5kxX6lpL2cvA=
          EOF
          chmod 600 ~/.ssh/known_hosts

      - name: Push to cPanel deployment repository
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          git remote remove cpanel 2>/dev/null || true
          git remote add cpanel "ssh://${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PORT}${REMOTE_REPO}"
          git push cpanel production:production

      - name: Run post-sync Laravel commands on cPanel
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${REMOTE_PORT}" \
            "${REMOTE_USER}@${REMOTE_HOST}" "REMOTE_REPO='${REMOTE_REPO}' bash -se" <<'EOF'
          set -euo pipefail

          cd "${REMOTE_REPO}"

          php artisan optimize:clear

          if command -v composer >/dev/null 2>&1; then
            COMPOSER_BIN="composer"
          elif [ -x /opt/cpanel/composer/bin/composer ]; then
            COMPOSER_BIN="/opt/cpanel/composer/bin/composer"
          else
            echo "Composer executable not found on server."
            exit 1
          fi

          "${COMPOSER_BIN}" dump-autoload -o --no-interaction
          php artisan migrate --force

          if [ ! -d public/build ] || [ -z "$(find public/build -mindepth 1 -print -quit)" ]; then
            echo "Build artifacts missing: public/build is empty or not found."
            exit 1
          fi

          SSR_PATH=""
          if [ -d bootstrap/ssr ]; then
            SSR_PATH="bootstrap/ssr"
          elif [ -d ssr ]; then
            SSR_PATH="ssr"
          fi

          if [ -z "${SSR_PATH}" ] || [ -z "$(find "${SSR_PATH}" -mindepth 1 -print -quit)" ]; then
            echo "SSR build artifacts missing: bootstrap/ssr or ssr is empty/not found."
            exit 1
          fi

          if [ -d resources/js ]; then
            find resources/js -mindepth 1 -delete
          fi

          if [ -d resources/css ]; then
            find resources/css -mindepth 1 -delete
          fi

          php artisan optimize
          EOF
