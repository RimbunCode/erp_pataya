name: Build And Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SOURCE_BRANCH: main
  DEPLOY_BRANCH: production

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare deploy worktree
        run: |
          git fetch origin ${{ env.DEPLOY_BRANCH }} --depth=1 || true

          if git show-ref --verify --quiet refs/remotes/origin/${{ env.DEPLOY_BRANCH }}; then
            git worktree add ../deploy-worktree origin/${{ env.DEPLOY_BRANCH }}
          else
            git worktree add -b ${{ env.DEPLOY_BRANCH }} ../deploy-worktree HEAD
          fi

      - name: Sync clean deploy contents
        run: |
          rsync -a --delete \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude="vendor" \
            --exclude="resources/js" \
            --exclude="resources/css" \
            ./ ../deploy-worktree/

          mkdir -p ../deploy-worktree/resources/js
          mkdir -p ../deploy-worktree/resources/css

      - name: Publish deploy branch
        id: publish
        run: |
          cd ../deploy-worktree

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: publish production artifacts"
          git push origin HEAD:${{ env.DEPLOY_BRANCH }}
          echo "published=true" >> "$GITHUB_OUTPUT"

  deploy-cpanel:
    needs: build-and-publish
    if: needs.build-and-publish.outputs.published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH for cPanel deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.SSH_PATH }}
            git pull origin ${{ env.DEPLOY_BRANCH }}
            composer install --no-dev --optimize-autoloader
            composer dump-autoload -o
            php artisan optimize:clear
            php artisan migrate --force
            php artisan optimize
