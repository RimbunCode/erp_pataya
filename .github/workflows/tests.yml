name: Lint & Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Fix Code Style
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changes_detected: ${{ steps.autocommit.outputs.changes_detected }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: true
      matrix:
        php: [8.4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.BOT_LINTER_TOKEN }}

      # Commit auto-fix pakai BOT_LINTER_TOKEN (PAT), bukan GITHUB_TOKEN, supaya
      # push berikutnya ter-attribute ke akun manusia -> tidak kena approval-gate
      # GitHub utk pull_request run yang di-update oleh github-actions[bot].
      # Konsekuensinya: kita sendiri yang harus deteksi & skip re-lint di run
      # retrigger itu (di bawah), karena GITHUB_TOKEN punya proteksi bawaan
      # utk itu tapi PAT tidak.
      - name: Detect if HEAD is our own lint auto-fix commit
        id: check-autofix
        run: |
          msg="$(git log -1 --pretty=%s)"
          if [ "$msg" = "fix: apply lint fixer (eslint + pint)" ]; then
            echo "is_autofix=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_autofix=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check-autofix.outputs.is_autofix != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP
        if: steps.check-autofix.outputs.is_autofix != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: pint

      - name: Run Pint
        if: steps.check-autofix.outputs.is_autofix != 'true'
        run: pint
        continue-on-error: true

      - name: Cache node_modules
        if: steps.check-autofix.outputs.is_autofix != 'true'
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.check-autofix.outputs.is_autofix != 'true' && steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint Frontend
        if: steps.check-autofix.outputs.is_autofix != 'true'
        run: npm run lint:fix
        continue-on-error: true

      - name: Commit linted files
        if: steps.check-autofix.outputs.is_autofix != 'true'
        id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "fix: apply lint fixer (eslint + pint)"
          commit_options: "--no-verify"

  backend:
    name: Backend (PHPUnit)
    needs: lint
    if: "!cancelled() && needs.lint.outputs.changes_detected != 'true'"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: true
      matrix:
        php: [8.4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Cache vendor
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run PHPUnit
        run: php artisan test --parallel --compact

  frontend:
    name: Frontend (Vitest) shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: lint
    if: "!cancelled() && needs.lint.outputs.changes_detected != 'true'"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Vitest (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npm run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
