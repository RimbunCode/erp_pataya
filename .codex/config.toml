[mcp_servers.laravel-boost]
command = "php"
args = ["artisan", "boost:mcp"]
cwd = "G:\\Project App\\erp"

[mcp_servers.herd]
command = "php"
args = ["C:/Users/RHD/.config/herd/bin/herd-mcp.phar"]
