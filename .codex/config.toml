model = "gpt-5.3-codex"
model_reasoning_effort = "xhigh"
[mcp_servers.herd]
command = "php"
args = ["-r", "$home=getenv('USERPROFILE')?:getenv('HOME'); if(!$home){fwrite(STDERR,'Unable to resolve USERPROFILE or HOME'.PHP_EOL); exit(1);} require rtrim(str_replace('\\\\','/',$home),'/').'/.config/herd/bin/herd-mcp.phar';"]
cwd = "."

[mcp_servers.herd.env]
SITE_PATH = "."

[mcp_servers.shadcn]
command = "npx"
args = ["shadcn@latest", "mcp"]

[mcp_servers.laravel-boost]
command = "php"
args = ["artisan", "boost:mcp"]
cwd = "G:\\Project App\\erp"
